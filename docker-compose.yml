services:
  # -------------------------------------------------------------
  # DỊCH VỤ 1: CƠ SỞ DỮ LIỆU MYSQL 8.0 (CHUẨN 3NF)
  # -------------------------------------------------------------
  mysql_db:
    image: mysql:8.0
    container_name: smartlib_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # Lưu trữ bền vững dữ liệu MySQL trên volume ổ cứng
      - mysql_data:/var/lib/mysql
      # Tự động nạp cấu trúc bảng và dữ liệu khởi tạo khi container chạy lần đầu
      - ./database/smartlib_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend_net

  # -------------------------------------------------------------
  # DỊCH VỤ 2: BACKEND FASTAPI (CHẠY BẰNG UVICORN)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartlib_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - MYSQL_HOST=mysql_db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Chia sẻ thư mục cấu hình và sao lưu dữ liệu với máy host
      - ./database:/app/database
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  # -------------------------------------------------------------
  # DỊCH VỤ 3: FRONTEND REACTJS (BUILD TĨNH VÀ SERVE BẰNG NGINX)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartlib_frontend
    restart: unless-stopped
    ports:
      # Mở cả cổng 80 chuẩn HTTP và cổng 443 để người dùng truy cập thuận tiện
      - "80:80"
      - "443:443"
    volumes:
      # Gắn cấu hình Nginx và chứng chỉ SSL vào container
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - frontend_net
  # -------------------------------------------------------------
  # DỊCH VỤ QUẢN TRỊ DATABASE: PHPMYADMIN
  # -------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: smartlib_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 500M
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - backend_net
# -------------------------------------------------------------
# CẤU HÌNH NETWORKS VÀ VOLUMES
# -------------------------------------------------------------
networks:
  backend_net:
    name: backend_net
    driver: bridge

  frontend_net:
    name: frontend_net
    driver: bridge

volumes:
  mysql_data:
    name: smartlib_mysql_data
    driver: local
