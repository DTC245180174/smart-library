# =================================================================
# CẤU HÌNH NGINX REVERSE PROXY & HTTPS HARDENING - SMARTLIB
# Sinh viên: Nguyễn Trung Học - MSSV: DTC245180174
# =================================================================
# Cấu hình vùng nhớ lưu trữ địa chỉ IP để giới hạn tốc độ (Rate Limiting) chống Brute-force
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_status 429;

# -----------------------------------------------------------------
# KHỐI 1: TỰ ĐỘNG CHUYỂN HƯỚNG HTTP (CỔNG 80) SANG HTTPS (CỔNG 443)
# -----------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    # Ẩn phiên bản Nginx để kẻ xấu không dò được lỗ hổng
    server_tokens off;

    # Endpoint nội bộ cung cấp metrics cho Nginx Prometheus Exporter (Tiêu chí 4)
    location = /stub_status {
        stub_status;
        access_log off;
        allow all;
    }

    # Mã HTTP 301 (Moved Permanently) tự động chuyển hướng mọi request sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------
# KHỐI 2: MÁY CHỦ BẢO MẬT CHÍNH HTTPS (CỔNG 443)
# -----------------------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost;

    # Ẩn thông tin phiên bản Nginx trong tiêu đề HTTP response
    server_tokens off;

    # Đường dẫn cặp chứng chỉ số tự ký RSA 2048-bit gắn từ thư mục certs
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Giới hạn giao thức TLS an toàn (chỉ cho phép TLSv1.2 và TLSv1.3 theo bài mẫu)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # -------------------------------------------------------------
    # BỘ HTTP SECURITY HEADERS TIÊU CHUẨN (ÁP DỤNG ALWAYS)
    # -------------------------------------------------------------
    # 1. Chống tấn công Clickjacking (ngăn chèn website vào thẻ iframe lừa đảo)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 2. Chống tấn công MIME-type sniffing (bắt buộc duyệt đúng định dạng file)
    add_header X-Content-Type-Options "nosniff" always;

    # 3. Kích hoạt bộ lọc chống tấn công XSS của trình duyệt
    add_header X-XSS-Protection "1; mode=block" always;

    # 4. Bảo vệ thông tin nguồn trang khi chuyển tiếp liên kết
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Ép buộc trình duyệt duy trì kết nối HTTPS trong 1 năm (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Bật nén Gzip tối ưu hóa hiệu năng truyền tải
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;

    # -------------------------------------------------------------
    # CẤU HÌNH ĐỊNH TUYẾN (ROUTING & REVERSE PROXY)
    # -------------------------------------------------------------
    # 1. Phục vụ giao diện tĩnh React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    # Áp dụng Rate Limit chống Brute-force cho endpoint xác thực đăng nhập
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # 2. Reverse proxy chuyển tiếp toàn bộ request API sang backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Cho phép tải lên ảnh bìa sách và tài liệu lên tới 25MB
        client_max_body_size 25M;
    }

    # Trang thông báo lỗi chuẩn
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
