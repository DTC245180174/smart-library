server:
  http_listen_port: 9080   # Cổng quản trị nội bộ của Promtail
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml  # Ghi nhớ vị trí byte dòng log cuối cùng đã đọc để không bị đọc trùng

clients:
  - url: http://smartlib_loki:3100/loki/api/v1/push # Đẩy log vào máy chủ Loki qua mạng nội bộ

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock # Kết nối Docker Socket để tự động quét danh sách container
        refresh_interval: 5s
    relabel_configs:
      # Bóc tách tên container từ nhãn Docker thành nhãn 'container' gọn gàng cho LogQL
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'job'
